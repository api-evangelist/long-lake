name: Long Lake
description: Long Lake is an AI-enabled roll-up holding company founded in 2023 that
  acquires and modernizes established American services businesses — spanning homeowners
  association (HOA) management, construction and infrastructure services, and corporate
  travel — by deploying its proprietary horizontal AI platform, Nexus. Backed by General
  Catalyst, Alpha Wave, D1 Capital, Thrive, and Elad Gil, the company has raised over
  $670 million and acquired more than 30 businesses, including a $6.3 billion agreement
  to take American Express Global Business Travel private. Long Lake operates as a
  private holding company (llmh.com) with no public API or developer surface; this
  profile is maintained in the API Evangelist network as a company lead.
